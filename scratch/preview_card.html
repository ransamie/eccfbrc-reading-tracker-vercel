
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0B0F19;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    .card-wrapper {
      width: 100%;
      max-width: 580px;
      aspect-ratio: 1/1;
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    }
    .card-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="card-wrapper">
    <img class="card-bg" src="public/score-card-template.png" />
    <div class="card-overlay">
      
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2160 2160" width="2160" height="2160">
  <defs>
    <!-- Canva drop shadow for name -->
    <filter id="nameShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="5" stdDeviation="4" flood-color="rgba(0, 0, 0, 0.45)" />
    </filter>
    <!-- Canva drop shadow for score -->
    <filter id="scoreShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="6" stdDeviation="6" flood-color="rgba(0, 0, 0, 0.65)" />
    </filter>
  </defs>

  <!-- 1. Top Right Edition (Right-aligned at x: 2030, y: 135) -->
  <text 
    x="2030" 
    y="135" 
    text-anchor="end" 
    dominant-baseline="central" 
    font-family="'Canva Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" 
    font-size="48" 
    font-weight="800" 
    letter-spacing="0.5px" 
    fill="#000000"
  >JUN – AUG NT EDITION</text>

  <!-- 2. Round Tag in Dark Navy Pill (Center at x: 1418, y: 544) -->
  <text 
    x="1418" 
    y="544" 
    text-anchor="middle" 
    dominant-baseline="central" 
    font-family="'Canva Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" 
    font-size="38" 
    font-weight="800" 
    letter-spacing="1px" 
    fill="#FFFFFF"
  >ROUND 7</text>

  <!-- 3. Team Name (Centered between golden lines at x: 1080, y: 658) -->
  <text 
    x="1080" 
    y="658" 
    text-anchor="middle" 
    dominant-baseline="central" 
    font-family="'Canva Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" 
    font-size="52" 
    font-weight="800" 
    fill="#192852"
  >Team Divine</text>

  <!-- 4. Participant Full Name (Center of Purple Box at x: 1080, y: 814) -->
  <text 
    x="1080" 
    y="814" 
    text-anchor="middle" 
    dominant-baseline="central" 
    font-family="'Canva Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" 
    font-size="66" 
    font-weight="800" 
    letter-spacing="1.5px" 
    fill="#FFFFFF" 
    filter="url(#nameShadow)"
  >AKPAN, RANSOM SAMUEL</text>

  <!-- 5. Big Score Digits inside Purple Circle (x: 1080, y: 1300) -->
  <g filter="url(#scoreShadow)">
    <!-- Main score number -->
    <text 
      x="1040" 
      y="1410" 
      text-anchor="end" 
      font-family="'Arial Black', Impact, 'Segoe UI', sans-serif" 
      font-size="360" 
      font-weight="900" 
      fill="#FFFFFF"
    >9</text>
    <!-- Denominator /10 -->
    <text 
      x="1060" 
      y="1395" 
      text-anchor="start" 
      font-family="'Arial Black', Impact, 'Segoe UI', sans-serif" 
      font-size="140" 
      font-weight="900" 
      fill="#FFFFFF"
    >/10</text>
  </g>

  <!-- 6. Performance Rating below circle (Center at x: 1080, y: 1754) -->
  <text 
    x="1080" 
    y="1754" 
    text-anchor="middle" 
    dominant-baseline="central" 
    font-family="'Arial Black', Impact, 'Segoe UI', sans-serif" 
    font-size="76" 
    font-weight="900" 
    letter-spacing="2px" 
    fill="#192852"
  >EXCEPTIONAL EXCELLENCE</text>
</svg>

    </div>
  </div>
</body>
</html>
